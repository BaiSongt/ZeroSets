[workspace]
resolver = "3"
members = [
    "crates/zeroset-core",
    "crates/zeroset-cli",
    "crates/zeroset-gpu",
    "crates/zeroset-wasm",
    "crates/zeroset-napi",
    "crates/zeroset-blocks",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BaiSongt/ZeroSets"
rust-version = "1.85"

[workspace.dependencies]
glam = { version = "0.34", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = "30.0"
pollster = "1.0"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1

