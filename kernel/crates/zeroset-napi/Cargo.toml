[package]
name = "zeroset-napi"
description = "napi-rs bindings for the ZeroSet implicit kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
zeroset-core = { path = "../zeroset-core" }
napi = { version = "3.16", features = ["async"] }
napi-derive = "3.7"
serde_json.workspace = true
tokio = { version = "1", features = ["rt"] }

[build-dependencies]
napi-build = "2.6"
